name: Build Yara AI APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.4'
    - name: Build debug APK
      run: gradle assembleDebug --stacktrace
    - name: Name the APK
      run: cp app/build/outputs/apk/debug/app-debug.apk Yara-AI.apk
    - name: Upload APK as artifact
      uses: actions/upload-artifact@v4
      with:
        name: Yara-AI-apk
        path: Yara-AI.apk
    - name: Publish APK as a GitHub Release (easy phone download)
      continue-on-error: true
      uses: softprops/action-gh-release@v2
      with:
        tag_name: yara-build-${{ github.run_number }}
        name: Yara AI build ${{ github.run_number }}
        files: Yara-AI.apk
